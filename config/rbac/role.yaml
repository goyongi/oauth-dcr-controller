---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations/finalizers
  verbs:
  - update
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations/status
  verbs:
  - get
  - patch
  - update
