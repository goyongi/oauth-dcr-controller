# This rule is not used by the project oauth-dcr-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to oauth.goyongi.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: oauth-dcr-controller
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: dcr-viewer-role
rules:
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations/status
  verbs:
  - get
