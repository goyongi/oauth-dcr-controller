# This rule is not used by the project oauth-dcr-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the oauth.goyongi.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: oauth-dcr-controller
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: dcr-editor-role
rules:
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oauth.goyongi.com
  resources:
  - dynamicclientregistrations/status
  verbs:
  - get
