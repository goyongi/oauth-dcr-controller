# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: oauth-dcr-controller
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: http # Name of the Service port that exposes the (plain HTTP) metrics
      scheme: http
      # The metrics endpoint is served over plain HTTP without authn/authz
      # (see --metrics-secure in cmd/main.go). Access is expected to be
      # restricted at the network layer via config/network-policy. To serve
      # metrics over HTTPS with authn/authz instead, set --metrics-secure=true,
      # restore the metrics-auth RBAC in config/rbac, and switch this back to
      # scheme: https with a bearerTokenFile + tlsConfig.
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: oauth-dcr-controller
